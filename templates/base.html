<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}{% endblock %} | Fundación</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='acceso.css') }}">
</head>
<body>
  <header>
    <a class="marca" href="{{ url_for('inicio') }}">
      <span class="marca-simbolo" aria-hidden="true"></span>
      Fundación para la Prevención del Suicidio
    </a>
    {% if g.cuenta %}
      <form action="{{ url_for('salir') }}" method="post">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <button class="secundario" type="submit">Cerrar sesión</button>
      </form>
    {% endif %}
  </header>

  <div class="acceso">
    <div class="arte" aria-hidden="true"><span></span></div>
    <main>
      {% for categoria, mensaje in get_flashed_messages(with_categories=true) %}
        <p class="mensaje {{ categoria }}" role="status">{{ mensaje }}</p>
      {% endfor %}
      {% block contenido %}{% endblock %}
    </main>
  </div>
</body>
</html>
